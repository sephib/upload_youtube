# Generated by Claude Sonnet 4.5
# YouTube metadata templates with CIFRIA attribution

[metadata.default]
category_id = "27"  # Education
default_language = "he"  # Hebrew
default_audio_language = "he"
privacy_status = "unlisted"
license = "youtube"
embeddable = true
public_stats_viewable = true

[metadata.cifria]
# CIFRIA (Centro Italiano di Formazione e Ricerca sull'Insegnamento e l'Apprendimento)
attribution_text = "Source materials courtesy of CIFRIA (Centro Italiano di Formazione e Ricerca sull'Insegnamento e l'Apprendimento)"
website = "https://cifria.org"
acknowledgment = "Special thanks to CIFRIA for providing educational resources"

[metadata.title_format]
# Template pattern for video titles
# Available variables: {parasha}, {aliyah}, {tradition}
pattern = "{parasha} - {aliyah} - {tradition} | CIFRIA"
max_length = 100

[metadata.description_format]
# Template for video descriptions
# Available variables: {parasha}, {aliyah}, {tradition}, {duration},
#                      {cifria_attribution}, {cifria_website}, {cifria_acknowledgment}
template = """
{parasha} - {aliyah} ({tradition})

Hebrew text synchronized with audio recitation of the Torah portion.

📖 Parasha: {parasha}
🎵 Aliyah: {aliyah}
📝 Tradition: {tradition}
⏱️ Duration: {duration}

---

{cifria_attribution}
{cifria_website}

{cifria_acknowledgment}

---

#Torah #Hebrew #Judaism #Education #CIFRIA
"""

[metadata.tags]
# Default tags for all videos
default = [
    "Torah",
    "Hebrew",
    "Judaism",
    "Tanakh",
    "Bible Study",
    "Jewish Education",
    "CIFRIA",
    "Hebrew Text",
    "Torah Reading",
    "Synchronized Text",
    "קריאה בתורה",
    "תורה"
]
