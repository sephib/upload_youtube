# Generated by Claude Code
[project]
name = "torah-sync"
version = "0.1.0"
description = "Automated Torah Reading Audio-Visual Synchronization"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Torah Sync Project"}
]
license = {text = "MIT"}
keywords = ["torah", "audio", "video", "synchronization", "hebrew"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Build dependencies (must come first)
    "numpy>=1.26.0",           # Required by aeneas and moviepy

    # Core processing
    # NOTE: aeneas requires manual installation due to build-time numpy dependency:
    # uv pip install numpy && uv pip install aeneas
    "moviepy>=1.0.3",          # Video rendering
    "httpx>=0.27.0",           # HTTP client for Sefaria API
    "pydub>=0.25.1",           # Audio conversion
    "audioop-lts>=0.2.2",      # Audio operations for Python 3.13+

    # Data & Configuration
    "pydantic>=2.6.0",         # Data validation
    "pydantic-settings>=2.1.0", # Settings management
    "dynaconf>=3.2.4",         # Configuration management

    # CLI & Utilities
    "click>=8.1.7",            # CLI framework
    "rich>=13.7.0",            # Terminal formatting
    "pillow>=10.2.0",          # Image processing for fonts
    "loguru>=0.7.2",           # Structured logging with automatic serialization
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "pre-commit>=3.6.0",
    "types-pillow>=10.2.0",
]

[project.scripts]
torah-sync = "src.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = ""
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = ["aeneas.*", "pydub.*", "moviepy.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
