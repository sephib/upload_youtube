# Generated by Claude Code
# Default configuration for Torah Sync application
# Override with environment variables (TORAH_SYNC_*) or user config (~/.torah-sync.toml)

[default]
cache_dir = "data/cache"
output_dir = "output/videos"
log_dir = "output/logs"
error_dir = "output/errors"
timestamp_map_dir = "data/timestamp_maps"
font_path = "/System/Library/Fonts/ArialHB.ttc"  # Arial Hebrew font
log_level = "INFO"
parallel_workers = 1

[default.video]
# Video rendering settings
resolution = [640, 360]  # 360p (width x height)
fps = 30
codec = "libx264"
crf = 23  # Constant Rate Factor (quality: 0=lossless, 51=worst)
font_size = 20  # Font size in points for verse text
highlight_color = "#FFD700"  # Gold color for highlighted verse
normal_color = "#FFFFFF"  # White for non-highlighted verses

[default.sefaria]
# Sefaria API configuration
base_url = "https://www.sefaria.org/api"
retry_attempts = 3
retry_backoff_base = 2  # seconds
retry_backoff_multiplier = 2
cache_responses = true
request_delay = 0.1  # 100ms between requests to avoid rate limiting

[default.alignment]
# Forced alignment configuration
audio_sample_rate = 16000  # 16kHz for speech alignment
audio_channels = 1  # Mono
min_confidence_threshold = 0.90  # Minimum alignment quality score
max_gap_seconds = 5.0  # Maximum allowed gap between verses
